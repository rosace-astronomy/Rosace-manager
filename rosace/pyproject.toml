[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rosace"
version = "0.5.0"
description = "Orchestrateur d'observations spectroscopiques"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    # uvicorn[standard] minus uvloop: uvloop is excluded on Windows anyway
    # (upstream marker), so we drop it explicitly to keep the dev environment
    # consistent across platforms and avoid a compiled dependency we don't need.
    "uvicorn>=0.29",
    "httptools>=0.6.3",
    "python-dotenv>=0.13",
    "watchfiles>=0.20",
    "websockets>=10.4",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",  # required by FastAPI for UploadFile (file upload endpoints)
    # hardware_indi/: dynamically-loaded INDI device drivers (SEQUENCER_BACKEND=indi)
    "pyindi-client>=2.2",
    "astropy>=6.0",
    "numpy>=1.26",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rosace*"]

[project.scripts]
rosace = "rosace.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
