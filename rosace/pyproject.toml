[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rosace"
version = "0.1.0.0"
description = "Orchestrateur d'observations spectroscopiques"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    # uvicorn[standard] minus uvloop: uvloop is excluded on Windows anyway
    # (upstream marker), so we drop it explicitly to keep the dev environment
    # consistent across platforms and avoid a compiled dependency we don't need.
    "uvicorn>=0.29",
    "httptools>=0.6.3",
    "python-dotenv>=0.13",
    "watchfiles>=0.20",
    "websockets>=10.4",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",  # required by FastAPI for UploadFile (file upload endpoints)
    # hardware_indi/: dynamically-loaded INDI device drivers (SEQUENCER_BACKEND=indi)
    "pyindi-client>=2.2",
    "astropy>=6.0",
    "numpy>=1.26",
    # reduction_plugins/axes_helpers.py: connected-component labelling and
    # image rotation (also pulled in transitively by astropy/photutils, but
    # imported directly here).
    "scipy>=1.11",
    # focus SEQUENCER sub-plugin: star detection/shape filtering for the
    # guiding-camera focus-quality measurement (DAOStarFinder; its
    # sharpness_range/roundness_range arguments need 3.0).
    "photutils>=3.0",
    # reduction_plugins: diagnostic and spectrum plots (PNG/PDF/SVG), e.g.
    # extract's picture of the spectrum window and sky zones.
    "matplotlib>=3.8",
    "requests>=2.31",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # fastapi.testclient (starlette.testclient under the hood) now prefers this
    # over httpx for its TestClient -- falls back to httpx with a deprecation
    # warning if absent. Only exercised by TestClient in tests, hence dev-only.
    "httpx2>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rosace*"]

[project.scripts]
rosace = "rosace.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
