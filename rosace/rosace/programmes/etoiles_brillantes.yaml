# ── Programme : Étoiles brillantes ───────────────────────────────────────────
# Vitesses radiales d'étoiles brillantes (V < 4).
# Mise au point ignorée si récente. Chaîne de réduction complète : chaque
# sous-plugin REDUCTION dépend explicitement de l'étape précédente (bias →
# dark → flat → extract), aucune étape ne peut être sautée.

programme: etoiles_brillantes
description: "Mesures de vitesse radiale sur étoiles brillantes — poses courtes"

sequencer:
  - slew        # Pointage télescope (focus omis : étoile brillante, réglage manuel)
  - expose      # Exposition CCD

reduction:
  - bias        # Soustraction biais
  - dark        # Soustraction dark
  - flat        # Correction flat-field
  - extract     # Extraction spectre 1D

sharing: blank_share
