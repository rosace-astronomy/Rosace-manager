# ── Programme : Étoiles Be ────────────────────────────────────────────────────
# Suivi spectral d'étoiles Be (émission Hα).
# Pipeline complet : pointage, mise au point, pose longue, réduction complète.

programme: etoiles_be
description: "Suivi spectral d'étoiles Be — émission Hα et variations de profil"

sequencer:
  - slew        # Pointage télescope
  - focus       # Mise au point automatique
  - expose      # Exposition CCD
  # - tatatata    # Pour tester...

reduction:
  - bias        # Soustraction biais
  - dark        # Soustraction dark
  - flat        # Correction flat-field
  - extract     # Extraction spectre 1D
