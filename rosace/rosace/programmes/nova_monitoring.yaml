# ── Programme : Suivi de novæ / transitoires ─────────────────────────────────
# Réactivité maximale : pipeline SEQUENCER minimal pour capturer un événement
# transitoire. Chaîne de réduction complète : chaque sous-plugin REDUCTION
# dépend explicitement de l'étape précédente (bias → dark → flat → extract),
# aucune étape ne peut être sautée.

programme: nova_monitoring
description: "Surveillance spectrale de novæ et transitoires — réactivité maximale"

sequencer:
  - slew        # Pointage immédiat
  - expose      # Pose directe sans mise au point (urgence)

reduction:
  - bias        # Soustraction biais
  - dark        # Soustraction dark
  - flat        # Correction flat-field
  - extract     # Extraction spectre 1D

sharing: blank_share
