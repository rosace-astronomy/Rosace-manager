<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Replace this file with your own observatory or association logo -->
  <defs>
    <clipPath id="cl">
      <circle cx="32" cy="32" r="28.5"/>
    </clipPath>
  </defs>

  <!-- Background disk -->
  <circle cx="32" cy="32" r="31.5" fill="#050a12"/>

  <!-- Outer flower of life: 6 circles (R=16) + centre, clipped to disk -->
  <g clip-path="url(#cl)" fill="none" stroke="#00d4ff" stroke-width="0.65">
    <circle cx="32"    cy="16"    r="16" opacity="0.60"/>
    <circle cx="45.86" cy="24"    r="16" opacity="0.60"/>
    <circle cx="45.86" cy="40"    r="16" opacity="0.60"/>
    <circle cx="32"    cy="48"    r="16" opacity="0.60"/>
    <circle cx="18.14" cy="40"    r="16" opacity="0.60"/>
    <circle cx="18.14" cy="24"    r="16" opacity="0.60"/>
    <circle cx="32"    cy="32"    r="16" opacity="0.35"/>
  </g>

  <!-- Inner flower: 6 circles (R=8.5) + centre -->
  <g clip-path="url(#cl)" fill="none" stroke="#00d4ff" stroke-width="0.45">
    <circle cx="32"    cy="23.5"  r="8.5" opacity="0.40"/>
    <circle cx="39.36" cy="27.75" r="8.5" opacity="0.40"/>
    <circle cx="39.36" cy="36.25" r="8.5" opacity="0.40"/>
    <circle cx="32"    cy="40.5"  r="8.5" opacity="0.40"/>
    <circle cx="24.64" cy="36.25" r="8.5" opacity="0.40"/>
    <circle cx="24.64" cy="27.75" r="8.5" opacity="0.40"/>
    <circle cx="32"    cy="32"    r="8.5" opacity="0.25"/>
  </g>

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.85"/>

  <!-- 6 major tick marks — at petal tip directions (30°, 90°, 150°, 210°, 270°, 330°) -->
  <g stroke="#00d4ff" stroke-width="1.2" stroke-linecap="round" opacity="0.80">
    <line x1="46.5"  y1="6.9"  x2="44.75" y2="9.9"/>
    <line x1="61"    y1="32"   x2="57.5"  y2="32"/>
    <line x1="46.5"  y1="57.1" x2="44.75" y2="54.1"/>
    <line x1="17.5"  y1="57.1" x2="19.25" y2="54.1"/>
    <line x1="3"     y1="32"   x2="6.5"   y2="32"/>
    <line x1="17.5"  y1="6.9"  x2="19.25" y2="9.9"/>
  </g>

  <!-- 6 minor tick marks — at petal centre directions (0°, 60°, 120°, 180°, 240°, 300°) -->
  <g stroke="#00d4ff" stroke-width="0.8" stroke-linecap="round" opacity="0.45">
    <line x1="32"   y1="3"    x2="32"   y2="5.5"/>
    <line x1="57.1" y1="17.5" x2="55.4" y2="18.5"/>
    <line x1="57.1" y1="46.5" x2="55.4" y2="45.5"/>
    <line x1="32"   y1="61"   x2="32"   y2="58.5"/>
    <line x1="6.9"  y1="46.5" x2="8.6"  y2="45.5"/>
    <line x1="6.9"  y1="17.5" x2="8.6"  y2="18.5"/>
  </g>

  <!-- Inner accent ring -->
  <circle cx="32" cy="32" r="7" fill="none" stroke="#00d4ff" stroke-width="0.8" opacity="0.45"/>

  <!-- Centre glow + dot -->
  <circle cx="32" cy="32" r="3" fill="rgba(0,212,255,0.2)"/>
  <circle cx="32" cy="32" r="2" fill="#00d4ff" opacity="0.95"/>
</svg>
