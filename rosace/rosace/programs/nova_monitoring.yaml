# ── Program: Nova / transient monitoring ─────────────────────────────────────
# Maximum responsiveness: minimal SEQUENCER pipeline to capture a transient
# event. Full reduction chain: each REDUCTION sub-plugin explicitly depends
# on the previous step (bias → dark → flat → extract), no step can be
# skipped.

program: nova_monitoring
description: "Spectral monitoring of novae and transients — maximum responsiveness"

sequencer:
  - slew                        # Immediate pointing
  - star_spectra_acquisition    # Direct exposure, no focusing (emergency)

reduction:
  - bias        # Bias subtraction
  - dark        # Dark subtraction
  - flat        # Flat-field correction
  - extract     # 1D spectrum extraction

sharing: blank_share
