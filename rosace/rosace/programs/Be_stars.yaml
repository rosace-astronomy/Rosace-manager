# ── Programme : Étoiles Be ────────────────────────────────────────────────────
# Suivi spectral d'étoiles Be (émission Hα).
# Pipeline complet : pointage, mise au point, pose longue, réduction complète.

program: Be_stars
description: "Suivi spectral d'étoiles Be — émission Hα et variations de profil"

sequencer:
  - pointing_72ed                # Pointage télescope
  # - focus                      # Mise au point automatique
  - star_spectra_acquisition     # Acquisition des poses science (bascule le spectro en SKY)
  - dark_acquisition             # Darks (session/bibliothèque/caméra) -- avant le reset SKY ci-dessous
  - bias_acquisition             # Bias (session/caméra) -- avant le reset SKY ci-dessous
  - spectro_light_source_to_sky  # Remet le spectroscope en SKY (sécurité fin d'observation)
  - stop_phd2_guiding            # Stoppe le guidage (PHD2)
reduction:
  - bias        # Soustraction biais
  - dark        # Soustraction dark
  - flat        # Correction flat-field
  - extract     # Extraction spectre 1D

sharing: blank_share
