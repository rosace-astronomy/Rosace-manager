# ── Program: Be stars ─────────────────────────────────────────────────────────
# Spectral monitoring of Be stars (Hα emission).
# Full pipeline: pointing, focusing, long exposure, full reduction.

program: Be_stars
description: "Spectral monitoring of Be stars — Hα emission and profile variations"

sequencer:
  # The active hardware profile may prepend its own steps here (equipment-specific,
  # e.g. guiding_dark_acquisition and a mount's own homing/sync) -- see its
  # sequencer_prefix, if it declares one.
  - pointing_72ed                # Telescope pointing
  - focus                        # Guiding-camera focus sharpness measurement (diagnostic only)
  - star_spectra_acquisition     # Science exposure acquisition (switches spectro to SKY)
  - stop_phd2_guiding            # Stops guiding (PHD2) -- unnecessary/lost during darks/bias
  - dark_acquisition             # Darks (session/library/camera) -- before the SKY reset below
  - bias_acquisition             # Bias (session/camera) -- before the SKY reset below
  - calib_acquisition            # Calibration lamp (session/camera) -- before the SKY reset below
  - flat_acquisition             # Flats (session/camera) -- before the SKY reset below
  - spectro_light_source_to_sky  # Resets the spectroscope to SKY (safety at end of observation)
reduction:
  - bias        # Bias subtraction
  - dark        # Dark subtraction
  - flat        # Flat-field correction
  - extract     # 1D spectrum extraction

sharing: blank_share
