# ═══════════════════════════════════════════════════════════════
# Rosace — CORE configuration.
# Read directly by main.py/auth.py/database.py, or needed to select which
# plugin family is active. Every installation must set these, regardless
# of which sub-plugins/programs it actually uses. Loaded once by config.py,
# each key below becomes a Python constant (e.g. `from .config import
# SITE_NAME`) — see CLAUDE.md's "Key configuration" table.
# ═══════════════════════════════════════════════════════════════

# Root directory for all persistent data: databases, logs, observations.
# Exposed as BASE_DATA_DIR in config.py.
base_data_dir: ~/.rosace

# Subdirectory (under base_data_dir) holding rosace.db and targets.db.
# Exposed as DATABASES_DIR in config.py.
databases_dir: databases

# Subdirectory (under base_data_dir) holding the rotating log file (rosace.log).
# Exposed as LOG_DIR in config.py.
log_dir: log

# Subdirectory (under base_data_dir) holding one folder per observation
# night, created by INIT_SESSION. Exposed as OBSERVATIONS_DIR in config.py.
observations_dir: observations

# Subdirectory (under base_data_dir) holding the reusable dark-frame library,
# one folder per temperature bucket. Kept here (not in subplugin_params)
# despite being consumed only by dark_acquisition: it's a directory, same
# shape/lifecycle as the paths above. Exposed as DARK_LIBRARY_DIR.
dark_library_dir: dark_library

# The installation's own facts, in one required block. Exposed as OBSERVATORY.
# - The site: site_name (names the session directories, SITE_NAME), position
#   (longitude signed, East positive; SITE_LATITUDE_DEG / SITE_LONGITUDE_DEG /
#   SITE_ELEVATION_M) and optional local horizon (KStars "Artificial Horizon"
#   export, see config.yaml; HORIZON_FILE). Required, except horizon_file.
# - The observatory's names: the three BeSS forms (observer, site, equipment,
#   exactly as in BeSS) and the equipment's parts, in English, ASCII, at most
#   40 characters for the BeSS names. Read by write_spectrum (FITS keywords
#   OBSERVER, BSS_SITE, BSS_INST, TELESCOP, INSTRUME, DETNAM, BSS_ITRP),
#   plot_spectrum and summary, and by export_demetra (the last four keys are
#   Demetra only). Optional for an installation that never writes a BeSS
#   spectrum.
observatory:
  site_name: St-Pancrasse           # names the session directories
  latitude_deg: 45.2895
  longitude_deg: 5.855              # East positive
  elevation_m: 955
  horizon_file: ~/.rosace/horizon/Horizon St-Pan.txt
  observer: F. Cochard              # OBSERVER
  site: St-Pancrasse                # BSS_SITE, exactly as in BeSS
  equipment: Alpy600-72ED-AM3       # BSS_INST, exactly as in BeSS
  telescope: 72ED refractor         # TELESCOP
  spectrograph: Alpy 600            # INSTRUME
  camera: Atik 314L                 # DETNAM
  resolving_power: 600              # BSS_ITRP: typical resolving power (indicative)
  site_uai_code: ""                 # Demetra only
  telescope_diameter_mm: 72         # Demetra only
  telescope_focal_mm: 420           # Demetra only -- to check
  sensor_type: CCD                  # Demetra only

# Name (without extension) of the active hardware profile in conf/ — only
# consulted when sequencer_backend (below) is 'indi'.
# Exposed as ACTIVE_HARDWARE / HARDWARE_CONFIG_PATH in config.py.
active_hardware: hardware_indi_72ED-LAN

# Name (registry in plugins/schedulers/__init__.py) of the active SCHEDULER
# plugin — each is an interchangeable target-selection algorithm. See
# plugins/schedulers/blank/scheduler.py for the contract a new one must
# follow. A selector key, not a plugin setting itself — a plugin can't
# declare its own selector. Exposed as ACTIVE_SCHEDULER in config.py.
# active_scheduler: scheduler_rosace_2026
active_scheduler: selector

# Which SEQUENCER sub-plugin family to load: 'internal' (simulation, no
# hardware) or 'indi' (real INDI protocol). Same reasoning as
# active_scheduler above — a selector, not a plugin setting.
# Exposed as SEQUENCER_BACKEND in config.py.
sequencer_backend: indi   # Must be 'internal' (for basic demo) or 'indi' (for real world)

# Delay before main.py asks SCHEDULER again after it reports nothing to observe.
# Read directly by session_runner() in main.py. Exposed as SCHEDULER_RETRY_SECONDS.
scheduler_retry_seconds: 60

# INIT_SESSION (sequencer_backend=indi only): max time to wait for each
# INDI device / PHD2 to answer, and for the science camera to reach its
# computed cooldown target temperature. General hardware infrastructure —
# not tied to any one plugin's own choices.
# Exposed as HARDWARE_CONNECT_TIMEOUT_SECONDS / CAMERA_COOLDOWN_TIMEOUT_SECONDS.
hardware_connect_timeout_seconds: 5
camera_cooldown_timeout_seconds: 300

# How long a login session (cookie) stays valid before requiring another
# login. Long by design: the app runs unattended overnight, and a short
# TTL would force inconvenient re-logins mid-session.
# Exposed as SESSION_TTL_HOURS in config.py.
session_ttl_hours: 336 # 336h = 14 days

# Whether the session cookie requires HTTPS (the 'Secure' attribute). Keep
# false for a plain-HTTP local network deployment — a true value stops the
# browser from ever sending the cookie back over HTTP, including on
# localhost. Only set true if every access path (local included) is
# guaranteed HTTPS. Exposed as SESSION_COOKIE_SECURE in config.py.
session_cookie_secure: false

# ═══════════════════════════════════════════════════════════════
# Rosace — PLUGIN parameters.
# Free-form: no schema is enforced here, and config.py never grows a new
# named constant for a key added below (see SUBPLUGIN_PARAMS in config.py).
# A sub-plugin not used by any of your programs needs no entry at all — its
# own code falls back to a sensible built-in default. Never read by main.py
# or any other orchestrator code, only by the sub-plugin(s) concerned.
# ═══════════════════════════════════════════════════════════════

subplugin_params:
  # Shared at the root (not nested under one plugin) because several
  # SEQUENCER sub-plugins read them: star_spectra_acquisition (both) and
  # dark_acquisition (max_exposure_time_seconds only). min_exposure_count
  # is read only by star_spectra_acquisition, but sits here too since it's
  # the third argument of the same compute_exposure_time_and_count() call
  # as the two above -- see acquisition_helpers.py.
  # 4.0 since 2026-09-26 (was 1.0): with 1.0 the brightest trace pixel stayed
  # at 14-17% of 65535; 4.0 puts the brightest stars near 64% (5.0 would have
  # given ~80%, too little margin for seeing and centring variations).
  exposure_time_mag0_seconds: 4.0
  # 120s (not the 30s debug value used by the INDI-simulator config.yaml) --
  # the real ceiling for the 72ED's own science camera, above the simulator's
  # short debug value since this file is what actually drives real sessions.
  max_exposure_time_seconds: 180
  # Minimum number of science sub-exposures per star, regardless of how the
  # per-sub-exposure duration compares to max_exposure_time_seconds above --
  # a bright star whose computed/explicit duration is short still gets a
  # proper stack (cosmic-ray rejection, etc.) instead of a single frame.
  min_exposure_count: 5

  # Also shared at the root -- read by slew_72ed, pointing_72ed,
  # stop_phd2_guiding (all four), slit_xy (slit_x/slit_y, the default it
  # measures around) and guiding_dark_acquisition (exposure_seconds only). Grouped
  # under one key since they describe a single coherent concept: the optical
  # alignment/plate-scale of the whole telescope+spectro+guiding-camera
  # assembly, not a property of the guiding camera device in isolation --
  # which is why they live here rather than in the active hardware profile
  # (see CLAUDE.md, HISTORY.md 2026-09-06). Values below are the 72ED's
  # calibrated guiding camera, valid regardless of which network path
  # (active_hardware) reaches it -- same physical instrument either way.
  guiding:
    # Exposure time (seconds) for a direct guiding-camera capture.
    exposure_seconds: 10
    # Plate scale (arcsec/pixel) of the guiding camera behind this telescope.
    # QHY5III174M since 2026-09-27: measured by a plate solve the same day.
    sampling_arcsec: 2.69
    # Spectrograph slit position in the guiding camera's field, in pixels.
    # Zero-indexed (pixel (0,0) = center of the first pixel, matching
    # astropy's WCS.pixel_to_world()) -- if read off a FITS viewer such as
    # DS9 or KStars (one-indexed), subtract 1 from each axis first.
    # Measured 2026-09-27 on a sky image with slit_xy's own method: the slit
    # runs from x=698 to x=1218, tilted about +0.25 deg; slit_x is its middle.
    slit_x: 958
    slit_y: 529.3

  pointing_72ed:
    # solve-field search radius (degrees) around the corrected position, for
    # pointing_72ed's plate solve. Must exceed the mount's first-pointing
    # error: the search is centred on the corrected (commanded) position,
    # which is that whole error away from where the telescope really points.
    phase2_search_radius_deg: 1

  slit_xy:
    # Light source for the slit image: CALIB, FLAT or SKY (never DARK -- the
    # slit would not be visible). With a lamp the field is bright and
    # star-free, the slit a dark line across it.
    light_source: FLAT
    # Exposure time (seconds) of the slit image.
    exposure_seconds: 0.01
    # Pause (seconds) between the spectroscope command and the exposure, so
    # the lamp is really on when a short exposure starts.
    light_settle_seconds: 1
    # Total width/height (pixels) of the search zone, centred on the default
    # slit_x/slit_y above; none = the whole width/height of the image.
    slit_x_area: 600
    slit_y_area: 60
    # Pixels added to the slit Y that slit_xy measures on the lamp image, to
    # get where the sky's light goes through the slit (the lamp does not
    # light the slit exactly as the sky does). Measured 2026-09-27 on SKY/FLAT
    # images taken within 30 s, one telescope position: sky minus FLAT =
    # +0.15 / +0.16 px.
    offset_y: 0.15

  # Text file (CSV with a header) listing the observations asked by hand, read
  # on every call by both scheduler_rosace_2026 and the selector's manual_list
  # planner (one file, one setting). Full path, any location.
  observation_list_path: ~/.rosace/targets/ManualList.txt

  scheduler_rosace_2026:
    # Minimum altitude (degrees) for a target to be considered observable.
    min_target_altitude_deg: 10
    # Hour-angle window (degrees, each side of the meridian) inside which a
    # target is not offered — see config.yaml. The AM3 flips pier side when the
    # two-step pointing (backlash_offset_deg = 2, hardware YAML) straddles the
    # meridian: 2 + 1 degree of margin.
    min_meridian_distance_deg: 3

  selector:
    # Installation settings of the multi-program selector
    # (active_scheduler: selector) — see config.yaml.
    # Altitude (degrees) below which the telescope never points, whatever the program.
    min_altitude_deg: 10
    # Same rule and value as scheduler_rosace_2026 above.
    min_meridian_distance_deg: 3
    # Fixed time per observation besides the exposure, to estimate its duration.
    overhead_minutes: 5
    # A planner that does not answer within this delay loses its turn.
    planner_timeout_seconds: 10
    # A target whose observation failed is not proposed again before this
    # delay (hours); a failed observation never consumes its request.
    failure_backoff_hours: 1
    # A booked observation (time window not open yet) is announced at most
    # this many minutes before its launch.
    lookahead_minutes: 60
    # How far (degrees of hour angle) past the meridian the mount keeps
    # tracking a target that started east of it: an observation that would end
    # further past is not proposed. Provisional value, to be checked on the AM3.
    meridian_tolerance_deg: 15

  dark_acquisition:
    # Number of DARK frames per series, fixed for the whole session.
    count: 5

  bias_acquisition:
    # Number of BIAS frames per series, fixed for the whole session.
    count: 5
    # BIAS exposure time (seconds) -- 0 by definition (no integration), but
    # some cameras refuse a literal 0s exposure -- raise this if so.
    exposure_time_seconds: 0.0

  calib_acquisition:
    # Number of CALIB frames per series.
    count: 3
    # CALIB exposure time (seconds) -- a calibration lamp exposure.
    exposure_time_seconds: 3.0
    # Maximum age (hours) of an existing session-directory CALIB series
    # before it's considered stale and reshot -- no library, unlike DARK.
    max_age_hours: 24.0

  flat_acquisition:
    # Number of FLAT frames per series. Shot once per session and reused
    # for the rest of it -- no staleness check at all, unlike CALIB.
    count: 5
    # FLAT exposure time (seconds).
    exposure_time_seconds: 3.0

  focus:
    # Fraction of the guiding camera's smaller frame dimension used as the
    # side of the central square search window (PSF quality away from the
    # optical axis -- coma, field curvature -- isn't representative of
    # focus). Instrument-specific, like backlash_offset_deg: how far
    # off-axis the optics stay clean varies with the actual guiding optics.
    window_fraction: 0.9

  calculate_flux:
    # Exposure suggestion: the peak raw pixel aimed at, as a fraction of the
    # saturation level (spectrum_flux_helpers.SATURATION_ADU) -- the margin
    # left for seeing and centring variations.
    target_peak_fraction: 0.7

  dispersion_law:
    # Reference lines of the calibration lamp: a text file in
    # <base_data_dir>/reference_lines/ (or an absolute path), one air
    # wavelength per line, "#" comments. A fact of the instrument (its lamp),
    # not of the scientific program -- hence here.
    reference_lines: Alpy600_ArNe.txt
    # Unit of the list, the tolerance, the approximate dispersion and the law:
    # A or nm.
    unit: A
    # Largest distance between a measured line and its reference wavelength.
    tolerance: 1.0
    # Degree of the polynomial law.
    degree: 3
    # Fewer lines kept than this is a failure, which stops the reduction.
    min_lines: 7
    # Optional approximate dispersion (unit per pixel, +-20 %): only speeds
    # the search up. Absent = no assumption on the scale (about 3.5 A/px on
    # the 72ED's Alpy 600 + Atik 314L).
    # approx_dispersion: 3.5

  # lambda_calibration:
    # Wavelength step of the calibrated spectrum (unit of the dispersion law).
    # Absent = the mean dispersion over the sensor, one point per pixel (about
    # 3.47 A on the 72ED) -- a finer step oversamples without adding
    # information. Kept commented out: an empty block would read as null.
    # step: 3.5

  response:
    # Instrumental response: a 1D FITS with a linear wavelength axis
    # (CRVAL1/CDELT1), in <base_data_dir>/response/ or an absolute path. The
    # target spectrum is divided by it.
    file: Vega_Object_C_RI.fit

  scaling:
    # Wavelength zone (spectrum's unit) whose mean level becomes 1. Must lie
    # inside the spectrum.
    wavelength_min: 6600
    wavelength_max: 6700

  crop:
    # Wavelength range kept (spectrum's unit): outside it the spectrum is too
    # faint or too noisy for this instrument.
    wavelength_min: 3750
    wavelength_max: 7500

  snr:
    # Wavelength zones (law's unit) where the signal-to-noise ratio of the
    # stacked spectrum is measured (DER_SNR), each one reported on its own,
    # all of equal importance.
    zones: [[3750, 7500], [6000, 7000]]

  plot_spectrum:
    # Formats of the final spectrum's plot, each produced only when true.
    png: true
    pdf: true
    svg: true
    balmer_lines: true                # mark the Balmer lines

  fripon:
    # FRIPON all-sky camera whose image of the observation is shown, with the
    # target marked (fripon_image). FRRA12 is at the observatory itself.
    station: FRRA12
    max_offset_minutes: 15            # capture farther than this from mid-observation: not used
    # lens: optional. The lens model is fitted on each image's own stars;
    # a stored one (scripts/fit_fripon_lens.py) only helps on cloudy images,
    # where it still places the target.

  export_demetra:
    # Demetra export: one ZIP per observation and/or one ZIP per session
    # (both false: no export).
    individual: false
    global: true
