# ─────────────────────────────────────────────────────────────
# Points config.py at this installation's own config.yaml, so a real
# deployment doesn't need to pass ROSACE_CONFIG on every launch.
#
# config.py reads this file first, then looks for <base_data_dir>/conf/config.yaml.
# If found, that's the active config (edit base_data_dir below to point
# somewhere else). If not found — a fresh install — config.py falls back to
# the packaged conf/config.yaml (demo defaults), no setup required.
#
# This file itself always lives here, in the package's own conf/: it has to
# be found before base_data_dir is even known, so it can't live under
# base_data_dir itself. See CLAUDE.md's "Configuration" section.
# ─────────────────────────────────────────────────────────────

base_data_dir: ~/.rosace
