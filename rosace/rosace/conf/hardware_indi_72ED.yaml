# This is the configuration file for all the INDI devices
INDI_drivers:

    guiding_camera:
        role: camera
        module: camera
        # module: asi_camera
        module_dir: rosace.hardware_indi.devices
        camera_name : ZWO CCD ASI120MM Mini
        # camera_name : Atik 314L
        class_name : IndiCamera
        # class_name : IndiASICamera
        indi_client :
            indi_host : 10.250.250.1
            indi_port : 7624
        cooling : true
        cooling_capability : -20
        sampling_arcsec : 1.75
        # Spectrograph slit position in this camera's field, in pixels.
        # Zero-indexed (pixel (0,0) = center of the first pixel, matching
        # astropy's WCS.pixel_to_world()) -- if read off a FITS viewer such
        # as DS9 (one-indexed), subtract 1 from each axis first.
        # TODO placeholder values below, not yet calibrated for this instrument.
        slit_x : 0
        slit_y : 0
    science_camera:
        role: camera
        module: camera
        module_dir: rosace.hardware_indi.devices
        camera_name : Atik 314L
        # camera_name : ZWO CCD ASI120MM Mini
        class_name : IndiCamera
        indi_client :
            indi_host : 10.250.250.1
            indi_port : 7624
        cooling : true
        cooling_capability : -20

    mount:
        role: mount
        module: mount
        module_dir: rosace.hardware_indi.devices
        mount_name : ZWO AM3 USB
        class_name : IndiMount
        indi_client :
            indi_host : 10.250.250.1
            indi_port : 7624

    pointing_camera:
        role: camera
        module: asi_camera
        module_dir: rosace.hardware_indi.devices
        camera_name : ZWO CCD ASI224MC
        class_name : IndiASICamera
        indi_client :
            indi_host : 10.250.250.1
            indi_port : 7624
        cooling : false

    focuser:
        role: focuser
        module: focuser
        module_dir: rosace.hardware_indi.devices
        focuser_name: ZWO EAF
        class_name : IndiFocuser
        # port: /dev/serial/by-id/usb-Optec__Inc._Optec_USB_Serial_Cable_OP5AORA9-if00-port0
        indi_client:
            indi_host: 10.250.250.1
            indi_port: 7624
        # focus_range:
        #     min: 10200
        #     max: 11400
        # autofocus_step:
        #     fine: 300
        #     coarse: 300
        # autofocus_range:
        #     fine: 2000
        #     coarse: 2000

PHD2_config:
    # host: 192.168.144.32
    host: 10.250.250.1 # Stellarmate
    port: 4400
    do_calibration: False
    # profile_name: St-Pancrasse
    # profile_name: Simulators
    profile_name: Simulator
    # profile_name: 72ED Stellarmate
    exposure_time_sec: 0.3
    settle:
        pixels: 7
        time: 3
        timeout: 120