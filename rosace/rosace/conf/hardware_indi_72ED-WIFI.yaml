# This is the configuration file for all the INDI devices
INDI_drivers:

    guiding_camera:
        role: camera
        # module: camera
        module: camera
        module_dir: rosace.hardware_indi.devices
        indi_name : QHY CCD QHY5III174M-4c7
        # indi_name : Atik 314L
        # class_name : IndiCamera
        class_name : IndiCamera
        indi_client :
            indi_host : 10.250.250.1
            indi_port : 7624
        cooling : FALSE
        # cooling_capability : -20
        # Pushed to the CCD_GAIN/CCD_OFFSET vectors once, right after
        # connecting (see IndiCamera.connect()/set_gain()/set_offset()) --
        # found 2026-09-20 that nothing ever sent these before, so the
        # camera silently ran on whatever it already had (0/0 in one real
        # case). QHY5III174M since 2026-09-27: its driver exposes exactly
        # these two vectors, so the plain IndiCamera class fits. The former
        # ASI120MM Mini kept gain/offset in CCD_CONTROLS instead and needed
        # IndiASICamera (asi_camera module). Gain kept low so the FLAT lamp
        # image of slit_xy does not saturate; offset set by feel, to adjust.
        gain : 10
        offset : 10
        # sampling_arcsec / exposure_seconds / slit_x / slit_y for this camera
        # now live in the active config.yaml's subplugin_params.guiding_camera
        # -- they describe the whole telescope+spectro+camera assembly, not
        # this device in isolation (see CLAUDE.md, HISTORY.md 2026-09-06).

    science_camera:
        role: camera
        module: camera
        module_dir: rosace.hardware_indi.devices
        indi_name : Atik 314L
        # indi_name : ZWO CCD ASI120MM Mini
        class_name : IndiCamera
        indi_client :
            indi_host : 10.250.250.1
            indi_port : 7624
        cooling : true
        cooling_capability : -30
        # Acceptable gap (degrees) between commanded and measured temperature
        # for the cooldown wait in INIT_SESSION to consider the target reached.
        temperature_tolerance_deg_c : 2

    mount:
        role: mount
        module: mount
        module_dir: rosace.hardware_indi.devices
        indi_name : ZWO AM3 USB
        class_name : IndiMount
        indi_client :
            indi_host : 10.250.250.1
            indi_port : 7624
        # Offset (degrees), added to both RA and DEC, for a preliminary slew
        # before the final slew to the exact target position -- always
        # approaching from the same side makes mechanical backlash consistent
        # from one slew to the next, instead of varying with slew direction.
        backlash_offset_deg : 2

    pointing_camera:
        role: camera
        module: asi_camera
        module_dir: rosace.hardware_indi.devices
        indi_name : ZWO CCD ASI224MC
        class_name : IndiASICamera
        indi_client :
            indi_host : 10.250.250.1
            indi_port : 7624
        cooling : false
        # Same CMOS gain/offset story as guiding_camera above -- not
        # currently connectable (USB3 cable/port fault, see TODO.md) so
        # these values are untested on the real ASI224MC, reused from the
        # ASI120MM Mini's own confirmed-live values pending a real check
        # once this camera is repaired and actually used by a sub-plugin.
        gain : 50
        offset : 15

    focuser:
        role: focuser
        module: focuser
        module_dir: rosace.hardware_indi.devices
        indi_name: ZWO EAF
        class_name : IndiFocuser
        port: /dev/serial/by-id/usb-Optec__Inc._Optec_USB_Serial_Cable_OP5AORA9-if00-port0
        indi_client:
            indi_host: 10.250.250.1
            indi_port: 7624
        focus_range:
            min: 10200
            max: 11400
        autofocus_step:
            fine: 300
            coarse: 300
        autofocus_range:
            fine: 2000
            coarse: 2000

    spectroscope:
        role: spectroscope
        module: spectro_Alpy600
        module_dir: rosace.hardware_indi.devices
        class_name: IndiSpectroAlpy600
        # Alpy600 light source, driven via the Stellarmate SM Pro's two
        # relay power channels (POWER_CHANNELS.POWER_CHANNEL_3/4) -- see
        # hardware_indi/devices/spectro_Alpy600.py for the SKY/DARK/FLAT/
        # CALIB mapping, fully confirmed on the real instrument.
        indi_name: SM Pro
        indi_client:
            indi_host: 10.250.250.1
            indi_port: 7624

PHD2_config: 
    # host: 192.168.144.32
    host: 10.250.250.1 # Stellarmate
    port: 4400
    do_calibration: False
    # profile_name: St-Pancrasse
    # profile_name: Simulators
    # profile_name: Simulator
    profile_name: 72ED Stellarmate
    exposure_time_sec: 0.3
    settle:
        pixels: 0.8
        time: 3
        timeout: 180

# SEQUENCER steps mandatory for every program run on this equipment,
# regardless of which science it's doing -- prepended automatically to
# every program's own `sequencer:` list (see
# pipeline_loader.py::hardware_sequencer_prefix()). guiding_dark_acquisition
# must come before home_sync_am3: home_sync_am3's own measured-sync homing
# captures and plate-solves guide images, which requires a guiding-camera
# dark median to already exist (capture_guide_image()'s own dark-subtraction
# requirement) -- see home_sync_am3.py's own docstring. home_sync_am3 is the
# AM3 mount's own park/unpark/sync recovery step -- a program YAML never
# needs to know this mount, or either of these steps, exists.
sequencer_prefix:
    - guiding_dark_acquisition
    - home_sync_am3
