# ═══════════════════════════════════════════════════════════════
# Rosace — DEMO configuration.
# Activated by `python -m rosace.main --demo-mode`, or by pointing
# ROSACE_CONFIG at this file directly (see main.py --help); the Docker image
# runs the same. A full sibling of conf/config.yaml — config.py reads every
# Core key unconditionally, so nothing here can be omitted just because it
# matches the packaged default.
#
# Purpose: show Rosace at work without a telescope. The real 72ED programs
# run unchanged (sequencer_backend: indi, Be_stars.yaml, full native
# reduction), against replay devices (active_hardware: hardware_replay) that
# hand back the frames of a real night: the replay dataset, built by
# scripts/build_demo_dataset.py into ~/.rosace-demo/replay. Exposures are
# shortened (a few seconds each), plate solving is real (solve-field must be
# installed). Isolated under its own base_data_dir so it can never mix with a
# real installation's data. Values below are the 72ED's installation config,
# except the names, the observation list and the scheduler's sky filters.
# ═══════════════════════════════════════════════════════════════

# Marks this config as the demo config — config.py exposes this as
# IS_DEMO_MODE, which makes the server seed the demo catalogue from the
# replay dataset (demo_seed.py) and start the fake PHD2 at startup. Optional
# everywhere else (defaults to false).
is_demo: true

# A dedicated sibling of the real ~/.rosace — own databases, own log, own
# observations, own observation list. Never touches a real install's data.
base_data_dir: ~/.rosace-demo

databases_dir: databases

log_dir: log

observations_dir: observations

dark_library_dir: dark_library

# An approximate site (to the degree) and neutral names: the demo, and the
# Docker image built from it, name neither the observer nor the site.
observatory:
  site_name: Rosace-Demo
  latitude_deg: 45.0
  longitude_deg: 6.0 # East positive
  elevation_m: 1000
  observer: Rosace demo
  site: Rosace demo
  equipment: Rosace demo
  telescope: 72ED refractor
  spectrograph: Alpy 600
  camera: Atik 314L
  resolving_power: 600
  site_uai_code: ""
  telescope_diameter_mm: 72
  telescope_focal_mm: 420
  sensor_type: CCD

# Replay devices and fake PHD2 — see conf/hardware_replay.yaml.
active_hardware: hardware_replay

# The real scheduler, reading the observation list seeded by demo_seed.py
# (one line per observation of the replay dataset, in its order).
active_scheduler: scheduler_rosace_2026

# The real SEQUENCER sub-plugins, as on the telescope.
sequencer_backend: indi

scheduler_retry_seconds: 60

hardware_connect_timeout_seconds: 5
camera_cooldown_timeout_seconds: 300

session_ttl_hours: 336 # 336h = 14 days
session_cookie_secure: false

subplugin_params:
  exposure_time_mag0_seconds: 4.0
  max_exposure_time_seconds: 180
  min_exposure_count: 5

  guiding:
    exposure_seconds: 10
    sampling_arcsec: 2.69
    slit_x: 958
    slit_y: 529.3

  pointing_72ed:
    phase2_search_radius_deg: 1

  slit_xy:
    light_source: FLAT
    exposure_seconds: 0.01
    light_settle_seconds: 1
    slit_x_area: 600
    slit_y_area: 60
    offset_y: 0.15

  # Seeded by demo_seed.py on first run, under this config's own base_data_dir.
  observation_list_path: ~/.rosace-demo/targets/ObservationList.txt

  scheduler_rosace_2026:
    # The recorded targets are offered whatever the time of the demo: no sky
    # filter (the replayed sky is the one of the recording night).
    min_target_altitude_deg: -90
    min_meridian_distance_deg: 0

  dark_acquisition:
    count: 5

  bias_acquisition:
    count: 5
    exposure_time_seconds: 0.0

  calib_acquisition:
    count: 3
    exposure_time_seconds: 3.0
    max_age_hours: 24.0

  flat_acquisition:
    count: 5
    exposure_time_seconds: 3.0

  focus:
    window_fraction: 0.9

  calculate_flux:
    target_peak_fraction: 0.7

  # Reference lines and response copied from the replay dataset into
  # ~/.rosace-demo/reference_lines/ and response/ by demo_seed.py.
  dispersion_law:
    reference_lines: Alpy600_ArNe.txt
    unit: A
    tolerance: 1.0
    degree: 3
    min_lines: 7

  response:
    file: Vega_Object_C_RI.fit

  scaling:
    wavelength_min: 6600
    wavelength_max: 6700

  crop:
    wavelength_min: 3750
    wavelength_max: 7500

  snr:
    zones: [[3750, 7500], [6000, 7000]]

  plot_spectrum:
    png: true
    pdf: true
    svg: true
    balmer_lines: true

  export_demetra:
    individual: false
    global: true
