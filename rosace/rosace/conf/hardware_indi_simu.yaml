# Configuration for all the INDI devices
INDI_drivers:
    guiding_camera:
        role: camera
        module: camera
        module_dir: rosace.hardware_indi.devices
        indi_name : CCD Simulator
        class_name : IndiCamera
        indi_client :
            indi_host : localhost
            indi_port : 7624
        cooling : true
        cooling_capability : -20
        sampling_arcsec : 2.55
        # Spectrograph slit position in this camera's field, in pixels.
        # Zero-indexed (pixel (0,0) = center of the first pixel, matching
        # astropy's WCS.pixel_to_world()) -- if read off a FITS viewer such
        # as DS9 (one-indexed), subtract 1 from each axis first.
        # Placeholder values, no real slit in the simulator.
        slit_x : 0
        slit_y : 0

    science_camera:
        role: camera
        module: camera
        module_dir: rosace.hardware_indi.devices
        indi_name : CCD Simulator
        class_name : IndiCamera
        indi_client :
            indi_host : localhost
            indi_port : 7624
        cooling : true
        cooling_capability : -20

    mount:
        role: mount
        module: mount
        module_dir: rosace.hardware_indi.devices
        indi_name : Telescope Simulator
        class_name : IndiMount
        indi_client :
            indi_host : localhost
            indi_port : 7624

    focuser:
        role: focuser
        module: focuser
        module_dir: rosace.hardware_indi.devices
        indi_name: Focuser Simulator
        class_name : IndiFocuser
        port: /dev/ttyUSB0
        indi_client:
            indi_host: localhost
            indi_port: 7624
        focus_range:
            min: 10200
            max: 11400
        autofocus_step:
            fine: 300
            coarse: 300
        autofocus_range:
            fine: 2000
            coarse: 2000

    spectroscope:
        role: spectroscope
        module: spectroscope_placeholder
        module_dir: rosace.hardware_indi.devices
        class_name: SpectroscopePlaceholder
        # indi_client/indi_name below are unused by SpectroscopePlaceholder
        # (pure in-memory, no real INDI protocol involved -- no INDI simulator
        # exists yet for a spectroscope light-source selector) -- present only
        # so every device entry satisfies the same required-fields check,
        # with no per-role exception in hardware_connectivity.py.
        indi_name: Spectroscope Placeholder
        indi_client:
            indi_host: localhost
            indi_port: 7624

PHD2_config:
    # host: 192.168.144.32
    host: 127.0.0.1 # localhost (but integers expected)
    port: 4400
    do_calibration: False
    # profile_name: St-Pancrasse
    # profile_name: Nomade 72ED Alpy
    profile_name: Simulator
    exposure_time_sec: 0.3
    settle:
        pixels: 7
        time: 3
        timeout: 120
