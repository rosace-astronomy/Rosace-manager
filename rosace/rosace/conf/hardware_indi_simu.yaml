# INDI simulators, not a telescope: every session run with this profile is
# recorded as simulated (sessions.simulated in rosace.db), so that its data can
# be purged with `python -m rosace.main --purge-simulated`.
simulated: true

# Configuration for all the INDI devices
INDI_drivers:
    guiding_camera:
        role: camera
        module: camera
        module_dir: rosace.hardware_indi.devices
        indi_name : CCD Simulator
        class_name : IndiCamera
        indi_client :
            indi_host : localhost
            indi_port : 7624
        cooling : true
        cooling_capability : -20
        # sampling_arcsec / exposure_seconds / slit_x / slit_y for this camera
        # now live in the active config.yaml's subplugin_params.guiding_camera
        # -- they describe the whole telescope+spectro+camera assembly, not
        # this device in isolation (see CLAUDE.md, HISTORY.md 2026-09-06).

    science_camera:
        role: camera
        module: camera
        module_dir: rosace.hardware_indi.devices
        indi_name : CCD Simulator
        class_name : IndiCamera
        indi_client :
            indi_host : localhost
            indi_port : 7624
        cooling : true
        cooling_capability : -20
        # Acceptable gap (degrees) between commanded and measured temperature
        # for the cooldown wait in INIT_SESSION to consider the target reached.
        temperature_tolerance_deg_c : 2

    mount:
        role: mount
        module: mount
        module_dir: rosace.hardware_indi.devices
        indi_name : Telescope Simulator
        class_name : IndiMount
        indi_client :
            indi_host : localhost
            indi_port : 7624
        # Offset (degrees), added to both RA and DEC, for a preliminary slew
        # before the final slew to the exact target position -- always
        # approaching from the same side makes mechanical backlash consistent
        # from one slew to the next, instead of varying with slew direction.
        backlash_offset_deg : 2

    focuser:
        role: focuser
        module: focuser
        module_dir: rosace.hardware_indi.devices
        indi_name: Focuser Simulator
        class_name : IndiFocuser
        port: /dev/ttyUSB0
        indi_client:
            indi_host: localhost
            indi_port: 7624
        focus_range:
            min: 10200
            max: 11400
        autofocus_step:
            fine: 300
            coarse: 300
        autofocus_range:
            fine: 2000
            coarse: 2000

    spectroscope:
        role: spectroscope
        module: spectroscope_placeholder
        module_dir: rosace.hardware_indi.devices
        class_name: SpectroscopePlaceholder
        # indi_client/indi_name below are unused by SpectroscopePlaceholder
        # (pure in-memory, no real INDI protocol involved -- no INDI simulator
        # exists yet for a spectroscope light-source selector) -- present only
        # so every device entry satisfies the same required-fields check,
        # with no per-role exception in hardware_connectivity.py.
        indi_name: Spectroscope Placeholder
        indi_client:
            indi_host: localhost
            indi_port: 7624
        # SpectroscopePlaceholder.set_light_source() never physically blocks
        # light (pure in-memory, see the class's own docstring) -- lets
        # guiding_dark_acquisition synthesize an all-zero placeholder dark
        # instead of shooting real DARK frames that wouldn't be dark at all.
        # Absent (defaults true) on every real spectroscope device.
        obstructs_light: false

# guiding_dark_acquisition only -- NOT home_sync_am3 (deliberately absent:
# the INDI Telescope Simulator isn't an AM3, and syncing it risks
# activating its own ALIGNMENT_SUBSYSTEM_ACTIVE model). Needed so
# slew_72ed/pointing_72ed's capture_guide_image() calls have a
# sequencer_data["guiding_dark_acquisition"] casier to read -- on this
# profile it always takes the "synthetic" origin (obstructs_light: false
# above), so this never shoots a real dark, just writes the all-zero
# placeholder once per session.
sequencer_prefix:
    - guiding_dark_acquisition

PHD2_config:
    # host: 192.0.2.32 # e.g. PHD2 on another computer
    host: 127.0.0.1 # localhost (but integers expected)
    port: 4400
    do_calibration: False
    # profile_name: Nomade 72ED Alpy
    profile_name: Simulators
    exposure_time_sec: 0.3
    settle:
        pixels: 7
        time: 3
        timeout: 120
