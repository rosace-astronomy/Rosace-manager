# Configuration for all the INDI devices
INDI_drivers:
    guiding_camera:
        role: camera
        module: camera
        module_dir: rosace.hardware_indi.devices
        indi_name : CCD Simulator
        class_name : IndiCamera
        indi_client :
            indi_host : localhost
            indi_port : 7624
        cooling : true
        cooling_capability : -20
        # 206265 * (PIXSIZE_um / 1000) / FOCALLEN_mm, from the CCD Simulator's
        # own configured pixel size (9um) and focal length (1624mm) -- verify
        # against those two settings again if either one ever changes.
        sampling_arcsec : 1.143
        # Exposure time (seconds) for a direct guiding-camera capture.
        exposure_seconds : 3.0
        # Spectrograph slit position in this camera's field, in pixels.
        # Zero-indexed (pixel (0,0) = center of the first pixel, matching
        # astropy's WCS.pixel_to_world()) -- if read off a FITS viewer such
        # as DS9 (one-indexed), subtract 1 from each axis first.
        # Placeholder values, no real slit in the simulator -- picked well
        # inside the 1000x1000 simulated frame (not the (0,0) corner) so the
        # pointing_72ed Phase 2 residual stays a small, plausible guiding
        # correction instead of ~half the frame.
        slit_x : 520
        slit_y : 370

    science_camera:
        role: camera
        module: camera
        module_dir: rosace.hardware_indi.devices
        indi_name : CCD Simulator
        class_name : IndiCamera
        indi_client :
            indi_host : localhost
            indi_port : 7624
        cooling : true
        cooling_capability : -20
        # Acceptable gap (degrees) between commanded and measured temperature
        # for the cooldown wait in INIT_SESSION to consider the target reached.
        temperature_tolerance_deg_c : 2

    mount:
        role: mount
        module: mount
        module_dir: rosace.hardware_indi.devices
        indi_name : Telescope Simulator
        class_name : IndiMount
        indi_client :
            indi_host : localhost
            indi_port : 7624
        # Offset (degrees), added to both RA and DEC, for a preliminary slew
        # before the final slew to the exact target position -- always
        # approaching from the same side makes mechanical backlash consistent
        # from one slew to the next, instead of varying with slew direction.
        backlash_offset_deg : 2

    focuser:
        role: focuser
        module: focuser
        module_dir: rosace.hardware_indi.devices
        indi_name: Focuser Simulator
        class_name : IndiFocuser
        port: /dev/ttyUSB0
        indi_client:
            indi_host: localhost
            indi_port: 7624
        focus_range:
            min: 10200
            max: 11400
        autofocus_step:
            fine: 300
            coarse: 300
        autofocus_range:
            fine: 2000
            coarse: 2000

    spectroscope:
        role: spectroscope
        module: spectroscope_placeholder
        module_dir: rosace.hardware_indi.devices
        class_name: SpectroscopePlaceholder
        # indi_client/indi_name below are unused by SpectroscopePlaceholder
        # (pure in-memory, no real INDI protocol involved -- no INDI simulator
        # exists yet for a spectroscope light-source selector) -- present only
        # so every device entry satisfies the same required-fields check,
        # with no per-role exception in hardware_connectivity.py.
        indi_name: Spectroscope Placeholder
        indi_client:
            indi_host: localhost
            indi_port: 7624

PHD2_config:
    # host: 192.168.144.32
    host: 127.0.0.1 # localhost (but integers expected)
    port: 4400
    do_calibration: False
    # profile_name: St-Pancrasse
    # profile_name: Nomade 72ED Alpy
    profile_name: Simulators
    exposure_time_sec: 0.3
    settle:
        pixels: 7
        time: 3
        timeout: 120
