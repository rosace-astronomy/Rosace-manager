# ─────────────────────────────────────────────────────────────
# Rosace — demo container config (docker/Dockerfile, ROSACE_CONFIG).
# Every Core key rosace/rosace/conf/config.yaml has (config.py reads each
# one unconditionally — see CLAUDE.md's Core/Plugin config split) — only the
# values that matter for a self-contained, no-hardware demo differ from the
# packaged defaults:
#   - base_data_dir points at /data (the container's VOLUME, so the demo
#     catalogue/observations survive a restart)
#   - sequencer_backend is "internal" (simulation — no INDI/PHD2 server to
#     connect to inside the container)
#   - subplugin_params.observation_list_path lives on
#     that same volume, so someone poking at the running demo can open/edit
#     it (add a target line) without a shell into the container's image layer
# ─────────────────────────────────────────────────────────────

base_data_dir: /data

databases_dir: databases

log_dir: log

observations_dir: observations

dark_library_dir: dark_library

observatory:
  site_name: Rosace-Demo
  latitude_deg: 45.0
  longitude_deg: 5.0
  elevation_m: 950

active_hardware: hardware_indi_simu

active_scheduler: scheduler_rosace_2026

sequencer_backend: internal

scheduler_retry_seconds: 60

hardware_connect_timeout_seconds: 5
camera_cooldown_timeout_seconds: 300

session_ttl_hours: 336

session_cookie_secure: false

subplugin_params:
  exposure_time_mag0_seconds: 1.0
  max_exposure_time_seconds: 300

  # Text file (CSV with a header) listing the observations asked by hand, read
  # on every call by both scheduler_rosace_2026 and the selector's manual_list
  # planner (one file, one setting). Full path, any location.
  observation_list_path: /data/ObservationList.txt

  scheduler_rosace_2026:
    min_target_altitude_deg: 10
